# A Windows-telepítő elkészítése és kiadása (GitHub Releases). Akkor fut, ha "desktop-v…" címkét kap a tároló.
# A telepített program ebből a kiadásból frissíti magát automatikusan.
name: Asztali program (Windows)
on:
  push:
    tags: ["desktop-v*"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - run: npx electron-builder --win --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
