# A Windows-telepítő elkészítése és kiadása (GitHub Releases). Akkor fut, ha a desktop/ mappa változik.
# A kiadás verzióját a desktop/package.json "version" mezője adja (új kiadáshoz ezt kell emelni).
# A telepített program ebből a kiadásból frissíti magát automatikusan.
name: Asztali program (Windows)
on:
  push:
    branches: [main]
    paths: ["desktop/**", ".github/workflows/desktop.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - run: npx electron-builder --win --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
