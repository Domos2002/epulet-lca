<!doctype html><html lang="hu"><head><meta charset="utf-8"><title>Épület-LCA</title>
<style>body{margin:0;min-height:100vh;display:grid;place-items:center;font-family:"Segoe UI",Arial,sans-serif;background:radial-gradient(120% 120% at 0% 0%,#1d6a5a 0%,#0b1a17 65%);color:#16222a}
.box{background:#fff;border-radius:14px;padding:28px 30px;max-width:440px;box-shadow:0 20px 60px rgba(0,0,0,.35)}h1{margin:0 0 6px;font-size:26px}p{line-height:1.5;color:#445}
button{font:inherit;font-weight:600;background:#1d6a5a;color:#fff;border:0;border-radius:8px;padding:9px 18px;cursor:pointer}</style></head>
<body><div class="box"><h1>Nincs kapcsolat</h1><p>Az Épület-LCA a projekteket a felhőben tárolja, és mindig a legfrissebb változatot tölti be, ezért internetkapcsolat kell hozzá.</p><p>Ellenőrizd a kapcsolatot, majd próbáld újra.</p>
<button onclick="window.lcaDesktop && window.lcaDesktop.retry()">Újrapróbálás</button></div>
<script>setInterval(() => { if (navigator.onLine) window.lcaDesktop && window.lcaDesktop.retry(); }, 15000);</script></body></html>
